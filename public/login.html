<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Book My Bus</title>
  <link rel="stylesheet" href="login.css">
  <link rel="icon" href="../public/images/Logo.png">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="login">
    <div class="logo">
      <img src="./images/New_Logo.png">
    </div>
    <div class="login-sec">
      <form id="loginForm">
        <label>Email: </label><input id="email" type="email" placeholder="Enter Email" required><br>
        <label>Password: </label><input id="password" type="password" placeholder="Enter Password" required><br>
        <button>Login</button>
      </form>
      <p>Don't have an account? <a href="signup.html">Register</a></p>
    </div>
  </div>
<script>
document.getElementById('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const res = await fetch('/api/auth/login', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ email, password })
  });
  const data = await res.json();
  if (!res.ok) return alert(data.error || 'Login failed');
  // redirect depending on role:
  if (data.user.role === 'provider') location.href = '/provider.html';
  else location.href = 'index.html';
});
</script>
</body>
</html>
