<!doctype html>
<html>
<head><meta charset="utf-8">
  <title>Book My Bus</title>
  <link rel="stylesheet" href="signup.css">
  <link rel="icon" href="../public/images/Logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="signup">
    <div class="logo">
      <img src="./images/New_Logo.png">
    </div>
    <div class="signupForm">
      <form id="signupForm">
        <label>Name:</label><input id="name" placeholder="Enter username" required><br>
        <label>Email:</label><input id="email" type="email" placeholder="Enter email" required><br>
        <label>Password:</label><input id="password" type="password" placeholder="Enter Password" required><br>
        <label>Role</label><select id="role"><option value="user">User</option><option value="provider">Provider</option></select><br>
        <button>Register</button>
      </form>
    </div>
  </div>
<script>
document.getElementById('signupForm').addEventListener('submit', async e => {
  e.preventDefault();
  const name = document.getElementById('name').value;
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const role = document.getElementById('role').value;
  const res = await fetch("http://localhost:5000/api/auth/register", {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ name, email, password, role })
  });
  const data = await res.json();
  if (!res.ok) return alert(data.error || 'Error');
  if (data.user.role === 'provider') location.href = 'provider.html';
  else location.href = 'index.html';
});
</script>
</body>
</html>
